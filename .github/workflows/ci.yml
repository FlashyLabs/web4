name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node 22, no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repository has no dependencies and no install step. If a future
      # change adds one, this job should fail on that change, not hide it.
      - name: Refuse a dependency
        run: |
          node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            for (const key of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              if (pkg[key] && Object.keys(pkg[key]).length) {
                console.error(`package.json declares ${key}; this repository installs nothing.`);
                process.exit(1);
              }
            }
          '

      # The estate register in flashyos (tools/estate-licences.mjs) names this
      # repository Apache-2.0, holder Flashy Labs. The LICENSE must be present
      # and carry that grant and that holder.
      - name: Require the Apache-2.0 LICENSE
        run: |
          if [ ! -f LICENSE ]; then
            echo "LICENSE is missing. The estate register names this repository Apache-2.0 (holder Flashy Labs)."
            exit 1
          fi
          grep -q 'Apache License' LICENSE || { echo "LICENSE is not the Apache License."; exit 1; }
          grep -q 'Copyright 2026 Flashy Labs' LICENSE || { echo "LICENSE does not name the holder (Flashy Labs)."; exit 1; }

      - run: npm test
